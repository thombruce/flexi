[package]
name = "clocking"
version = "0.3.0"
edition = "2021"
description = "A minimal CLI tool for logging your working hours"
license = "MIT"
repository = "https://github.com/thombruce/flexi"
keywords = ["clocking", "time", "cli", "productivity", "timesheet"]
categories = ["command-line-utilities"]

[[bin]]
name = "clocking"
path = "src/main.rs"

[dependencies]
foolscap = { path = "../foolscap", version = "0.1.0" }
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
