[package]
name = "calchemy"
version = "0.7.0"
edition = "2021"
description = "A minimal plaintext calendar and appointment book for the command line"
license = "MIT"
repository = "https://github.com/thombruce/flexi"
keywords = ["calendar", "appointments", "agenda", "cli", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "calchemy"
path = "src/main.rs"

[dependencies]
foolscap = { path = "../foolscap", version = "0.2.0", features = ["dates"] }
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
