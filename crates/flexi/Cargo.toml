[package]
name = "flexi"
version = "0.17.0"
edition = "2021"
description = "A minimal CLI tool for tracking your flexi-time balance"
license = "MIT"
repository = "https://github.com/thombruce/flexi"
keywords = ["flexi", "time", "cli", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "flexi"
path = "src/main.rs"

[dependencies]
foolscap = { path = "../foolscap", version = "0.1.0" }
anyhow = "1"
chrono = "0.4"
arboard = "3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
serde_json = "1"
tempfile = "3"
