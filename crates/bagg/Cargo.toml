[package]
name = "bagg"
version = "0.3.0"
edition = "2021"
description = "A minimal plaintext shopping list / wishlist for the command line"
license = "MIT"
repository = "https://github.com/thombruce/flexi"
keywords = ["shopping", "wishlist", "cli", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "bagg"
path = "src/main.rs"

[dependencies]
flexi-common = { path = "../flexi-common", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
