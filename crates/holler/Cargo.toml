[package]
name = "holler"
version = "0.3.0"
edition = "2021"
description = "A minimal plaintext contacts / rolodex for the command line"
license = "MIT"
repository = "https://github.com/thombruce/flexi"
keywords = ["contacts", "rolodex", "cli", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "holler"
path = "src/main.rs"

[dependencies]
foolscap = { path = "../foolscap", version = "0.2.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
